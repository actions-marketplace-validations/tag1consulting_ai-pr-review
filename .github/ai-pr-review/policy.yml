# AI PR Review — repo-local review policy for ai-pr-review itself (dogfooding).
#
# Loaded via `git show origin/{base-ref}:.github/ai-pr-review/policy.yml` from
# the PR's BASE branch — a PR editing this file has no effect on its own
# review. Full schema and precedence: docs/policy.md
#
# Precedence (highest wins): slash command > explicit action input/label >
# this file's route matching > engine default (quick mode).

version: 1

policies:
  # Docs-only changes: no agents, no analyzers. Scoped to structurally
  # doc-only trees (docs/**, language-profiles/**) rather than a bare
  # '*.md' glob — path matching is "any changed file matches any glob",
  # so a broad '*.md' would also zero out review on a PR that bundles a
  # README/CLAUDE.md edit alongside real code changes in the same diff.
  content:
    agents: []
    analyzers: []

  # Full review. Routed to automatically for release/* PRs below, and also
  # what `/ai-pr-review review-full` runs on any PR.
  deep:
    extends: full

routes:
  # Release branches first, ahead of the content route below, so a release
  # PR that happens to touch docs/** (e.g. CHANGELOG-style updates) doesn't
  # match the docs route instead — the any-file-matches-any-glob semantics
  # above would otherwise let a docs change on a release branch skip this
  # entirely.
  #
  # Release PRs get a full-mode review on every push. Work lands on a
  # long-lived release/vX.Y.Z branch first (see CLAUDE.md's release process),
  # so the release PR into main carries the whole code diff since the last
  # release, and this is the one review that looks at all of it. Feature and
  # issue PRs into release/* keep the default quick review. Because the
  # policy is `deep`, an automatic push satisfies `require: deep` and the
  # ai-pr-review/policy-gate check passes without a manual
  # `/ai-pr-review review-full`.
  - when: {head-branch: 'release/*'}
    policy: deep
    require: deep

  # Doc-only PRs get the near-zero-cost tier.
  - when: {paths: ['docs/**', 'language-profiles/**']}
    policy: content

# No `default:` — everything else falls through to the engine's hard-coded
# default (quick mode, no restriction), same as before this file existed.
